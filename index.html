<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dormhi — Coming Soon</title>
    <meta name="description" content="Dormhi's personal website is coming soon." />
    <link rel="icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', sans-serif;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }

        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .coming-soon {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            text-shadow:
                0 0 10px rgba(0, 240, 255, 0.8),
                0 0 30px rgba(0, 240, 255, 0.5),
                0 0 60px rgba(0, 240, 255, 0.3),
                0 0 100px rgba(191, 0, 255, 0.2);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(0,240,255,0.8), 0 0 30px rgba(0,240,255,0.5), 0 0 60px rgba(0,240,255,0.3); }
            50% { opacity: 0.85; text-shadow: 0 0 20px rgba(0,240,255,1), 0 0 50px rgba(0,240,255,0.7), 0 0 100px rgba(191,0,255,0.4); }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay muted loop playsinline>
        <source src="videos/donen_logo.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="coming-soon">Coming Soon</h1>
    </div>

    <script>
        const video = document.querySelector('.video-bg');
        video.muted = true;
        video.play().catch(() => {
            document.addEventListener('click', () => { video.muted = true; video.play(); }, { once: true });
        });
    </script>

</body>
</html>
