<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dormhi - Personal Portfolio</title>
    <meta name="description" content="Davut Can Cuci (Dormhi) - Computer Engineering student, software developer. Personal portfolio website." />
    <meta name="author" content="Davut Can Cuci" />
    <meta property="og:title" content="Dormhi - Personal Portfolio" />
    <meta property="og:description" content="Computer Engineering student and software developer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dormhi.com" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body data-theme="dark">

    <!-- Video Background (fixed, full-screen) -->
    <video id="bg-video" class="video-bg" autoplay muted loop playsinline>
        <source src="videos/logo_video.mp4" type="video/mp4" />
    </video>
    <div id="video-overlay" class="video-overlay"></div>

    <!-- Navigation -->
    <nav id="navbar" class="navbar">
        <div class="nav-container">
            <a href="#home" class="nav-logo">Dormhi</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="#home" class="nav-link active" data-i18n="nav.home">Home</a></li>
                <li><a href="#about" class="nav-link" data-i18n="nav.about">About</a></li>
                <li><a href="#skills" class="nav-link" data-i18n="nav.skills">Skills</a></li>
                <li><a href="#portfolio" class="nav-link" data-i18n="nav.portfolio">Portfolio</a></li>
                <li><a href="#contact" class="nav-link" data-i18n="nav.contact">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="nav-btn" title="Toggle theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="lang-toggle" class="nav-btn" title="Change language">
                    <span>EN</span>
                </button>
                <button id="nav-hamburger" class="nav-hamburger" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="section hero-section">
        <div class="hero-content">
            <img src="images/dormhi_profil.png" alt="Dormhi" class="hero-avatar" />
            <h1 class="hero-title" data-i18n="hero.title">Hi, I'm Dormhi</h1>
            <p class="hero-subtitle" data-i18n="hero.subtitle">Computer Engineering Student | Software Developer</p>
            <div class="hero-buttons">
                <a href="#portfolio" class="btn btn-primary" data-i18n="hero.projects">My Projects</a>
                <a href="#contact" class="btn btn-outline" data-i18n="hero.contact">Get in Touch</a>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section">
        <div class="container">
            <h2 class="section-title" data-i18n="about.title">About Me</h2>
            <div class="about-content">
                <!-- About content will go here -->
            </div>
        </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section">
        <div class="container">
            <h2 class="section-title" data-i18n="skills.title">Skills</h2>
            <div class="skills-content">
                <!-- Skills content will go here -->
            </div>
        </div>
    </section>

    <!-- Portfolio Section -->
    <section id="portfolio" class="section">
        <div class="container">
            <h2 class="section-title" data-i18n="portfolio.title">Portfolio</h2>
            <div id="portfolio-grid" class="portfolio-grid">
                <!-- GitHub repos will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section">
        <div class="container">
            <h2 class="section-title" data-i18n="contact.title">Contact</h2>
            <div class="contact-content">
                <div class="social-links">
                    <a href="https://instagram.com/davutcucy" target="_blank" title="Instagram" class="social-link">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://github.com/dormhi" target="_blank" title="GitHub" class="social-link">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/davutcuci" target="_blank" title="LinkedIn" class="social-link">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Dormhi</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
